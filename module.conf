# ABK external module metadata.
# This module keeps kernel source integration separate from the companion APK and
# never modifies the ABK or FIDO repositories in place.

ABK_MODULE_ID="abk_uvc_camera"
ABK_MODULE_NAME="ABK USB UVC Camera"
ABK_MODULE_VERSION="0.1.0"
ABK_MODULE_DESCRIPTION="Expose Android Camera2 or test-pattern frames through the standard USB UVC gadget while preserving ABK FIDO."
ABK_MODULE_REPO_URL="https://github.com/xingguangcuican6666/ABK_5.15_Camera"
ABK_MODULE_SUPPORTED_STAGES="after_patch,before_build"
ABK_MODULE_DEFAULT_STAGE="after_patch"
ABK_MODULE_RECOMMENDED_STAGES="after_patch,before_build"

ABK_EXTENSION_ID="abk_uvc_camera"
ABK_EXTENSION_REQUIRES_COMPANION_APP="true"
ABK_EXTENSION_COMPANION_PACKAGE="com.abk.extension.camera"
ABK_EXTENSION_COMPANION_DISPLAY_NAME="ABK Camera Companion"
ABK_EXTENSION_COMPANION_ASSET_NAME="abk-camera-companion-release.apk"
ABK_EXTENSION_COMPANION_DOWNLOAD_URL="https://github.com/xingguangcuican6666/ABK_5.15_Camera/releases/latest/download/abk-camera-companion-release.apk"
ABK_EXTENSION_SERVICE_ACTIVITY=".CameraControlService"
ABK_EXTENSION_SETTINGS_SUPPORTED="true"
ABK_EXTENSION_PER_APP_SUPPORTED="false"
ABK_EXTENSION_OOBE_PRIORITY="80"
